name: Base Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    permissions:
      contents: read
      checks: write
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    env:
      # Reduce GC frequency (default 100) to speed up builds/tests at cost of higher memory
      GOGC: "400"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - name: Use mise to install dependencies
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.12
          cache_save: ${{ github.ref == 'refs/heads/main' }}
        env:
          # Adding token here to reduce the likelihood of hitting rate limit issues.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows Setup
        if: runner.os == 'Windows'
        run: pwsh -File ./.github/scripts/setup/windows-setup.ps1
        shell: pwsh

      - name: Windows Dev Drive
        if: runner.os == 'Windows'
        run: pwsh -File ./.github/scripts/setup/windows-dev-drive.ps1
        shell: pwsh

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          gocache-name: test

      - name: Run Tests
        id: run-tests
        run: ./.github/scripts/coverage/coverage-report.sh run .
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMPDIR: ${{ matrix.os == 'macos' && '/tmp' || '' }}

      - name: Report Windows Disk Usage
        if: always() && runner.os == 'Windows'
        run: Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystemType, Size, SizeRemaining
        shell: pwsh

      - name: Generate Coverage Summary
        if: always() && matrix.os == 'ubuntu'
        run: ./.github/scripts/coverage/coverage-report.sh summary
        shell: bash

      - name: Extract Timing Summary
        if: always() && matrix.os == 'ubuntu'
        run: ./.github/scripts/coverage/coverage-report.sh timing test-events.ndjson timing-summary.json
        shell: bash

      - name: Upload test-events.ndjson
        if: always() && matrix.os == 'ubuntu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-events.ndjson
          path: test-events.ndjson
          retention-days: 7

      - name: Upload test-events-windows.ndjson
        if: always() && matrix.os == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-events-windows.ndjson
          path: test-events.ndjson
          retention-days: 7

      - name: Upload timing-summary.json
        if: always() && matrix.os == 'ubuntu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timing-summary.json
          path: timing-summary.json
          retention-days: 30

      - name: Upload coverage.out
        if: always() && matrix.os == 'ubuntu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage.out
          path: coverage.out
          retention-days: 30

      - name: Upload coverage-summary.json
        if: always() && matrix.os == 'ubuntu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary.json
          path: coverage-summary.json
          retention-days: 30

      - name: Upload coverage-summary.html
        if: always() && matrix.os == 'ubuntu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary.html
          path: coverage-summary.html
          retention-days: 30

      - name: Upload Report (${{ matrix.os }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ matrix.os }}
          path: result.xml

      - name: Display Test Results (${{ matrix.os }})
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        if: always()
        with:
          report_paths: result.xml
          detailed_summary: "true"
          include_time_in_summary: "true"
          group_suite: "true"

      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: $/.github/actions/go-cache-save
