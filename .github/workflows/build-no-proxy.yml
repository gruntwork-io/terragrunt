name: Build Without Go Proxy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-no-proxy:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Use mise to install dependencies
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.12
          cache_save: ${{ github.ref == 'refs/heads/main' }}
        env:
          # Adding token here to reduce the likelihood of hitting rate limit issues.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          gocache-name: build

      - name: Build Terragrunt without Go proxy
        run: ./.github/scripts/build/no-proxy-binaries.sh
