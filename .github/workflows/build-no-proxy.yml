name: Build Without Go Proxy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-no-proxy:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Use mise to install dependencies
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.12
          cache_save: ${{ github.ref == 'refs/heads/main' }}
        env:
          # Adding token here to reduce the likelihood of hitting rate limit issues.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          gocache-name: build

      - name: Build Terragrunt without Go proxy
        run: ./.github/scripts/build/no-proxy-binaries.sh
