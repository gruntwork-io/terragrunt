name: Build

on:
  workflow_call:
    inputs:
      version:
        description: "Version string for ldflags (defaults to github.ref_name)"
        required: false
        type: string
        default: ""
      is_release:
        description: "Whether this is a release build (enables signing)"
        required: false
        type: boolean
        default: false
      ref:
        description: "Git ref to checkout (defaults to triggering ref)"
        required: false
        type: string
        default: ""

jobs:
  detect_release:
    name: Detect if this is a release build
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ inputs.ref || '' }}
          sparse-checkout: .github/scripts/build

      - name: Check if release build
        id: check
        env:
          IS_RELEASE_INPUT: ${{ inputs.is_release }}
        run: ./.github/scripts/build/detect-release.sh

  # One job for all seven targets: seven wrote a 1-2GB build cache apiece, which
  # alone exceeded the repo's 10GB cache budget.
  #
  # Each platform keeps its own artifact name, which sign-macos, sign-windows
  # and upload-tip-build select by pattern.
  build:
    name: Build
    needs: detect_release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Use mise to install dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: go-cache-paths
        run: ./.github/scripts/ci/go-cache-paths.sh
        shell: bash

      - name: Go Build Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.go-cache-paths.outputs.go-build }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}-crossbuild
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Go Mod Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Build Terragrunt
        run: ./.github/scripts/build/release-binaries.sh
        env:
          BUILD_VERSION: ${{ inputs.version || github.ref_name }}

      - name: Upload darwin/amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terragrunt_darwin_amd64
          path: bin/terragrunt_darwin_amd64*

      - name: Upload darwin/arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terragrunt_darwin_arm64
          path: bin/terragrunt_darwin_arm64*

      - name: Upload linux/386
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terragrunt_linux_386
          path: bin/terragrunt_linux_386*

      - name: Upload linux/amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terragrunt_linux_amd64
          path: bin/terragrunt_linux_amd64*

      - name: Upload linux/arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terragrunt_linux_arm64
          path: bin/terragrunt_linux_arm64*

      - name: Upload windows/386
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terragrunt_windows_386
          path: bin/terragrunt_windows_386*

      - name: Upload windows/amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terragrunt_windows_amd64
          path: bin/terragrunt_windows_amd64*

  sign_macos:
    name: Sign MacOS Binaries
    if: ${{ needs.detect_release.outputs.is_release == 'true' }}
    needs: [detect_release, build]
    uses: ./.github/workflows/sign-macos.yml
    secrets: inherit

  sign_windows:
    name: Sign Windows Binaries
    if: ${{ needs.detect_release.outputs.is_release == 'true' }}
    needs: [detect_release, build]
    uses: ./.github/workflows/sign-windows.yml
    secrets: inherit

  merge_signed_binaries:
    name: Merge All Signed Binaries
    if: ${{ needs.detect_release.outputs.is_release == 'true' }}
    needs: [detect_release, sign_macos, sign_windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Download macOS signed binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-signed-files
          path: bin/

      - name: Verify macOS binaries after download
        run: ./.github/scripts/release/verify-macos-artifacts.sh

      - name: Download Windows signed binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-signed-files
          path: bin/

      - name: Download Linux binaries (unsigned)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: terragrunt_linux_*
          path: bin/
          merge-multiple: true

      - name: List all binaries
        run: ./.github/scripts/release/list-binaries.sh

      - name: Upload All Signed Binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: all-signed-binaries
          path: bin/*
