name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Skips the Go jobs for pushes that touch only docs, and the install script
  # tests for pushes that leave the install script alone. Every Go job needs
  # lint, so gating lint skips the rest.
  changes:
    name: Detect changes
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      install: ${{ steps.detect.outputs.install }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          # Full history for the merge base with main; file lists need no blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Detect changes
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: ./.github/scripts/ci/detect-changes.sh "$BEFORE" >>"$GITHUB_OUTPUT"

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
    secrets: inherit

  static_checks:
    uses: ./.github/workflows/static-checks.yml
    permissions:
      contents: read
    secrets: inherit

  install_script_test:
    needs: [changes]
    if: needs.changes.outputs.install == 'true'
    uses: ./.github/workflows/install-script-test.yml
    permissions:
      contents: read
    secrets: inherit

  # Only fast checks gate here. Anything added to this needs list delays the
  # whole integration matrix behind it; the rest are enforced by branch
  # protection rules, not by job dependencies.
  base_tests:
    needs: [lint]
    uses: ./.github/workflows/base-test.yml
    permissions:
      contents: read
      checks: write
    secrets: inherit

  sandboxed_tests:
    needs: [lint]
    uses: ./.github/workflows/sandboxed-test.yml
    permissions:
      contents: read
    secrets: inherit

  build:
    needs: [lint]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref == 'refs/heads/main' && format('tip-{0}', github.sha) || '' }}
    permissions:
      contents: read
    secrets: inherit

  tip_build:
    needs: [build]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/upload-tip-build.yml
    with:
      prefix: tip
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets:
      TIP_BUILD_ROLE_ARN: ${{ secrets.TIP_BUILD_ROLE_ARN }}
      TIP_BUILD_BUCKET: ${{ secrets.TIP_BUILD_BUCKET }}
      SIGNING_GPG_PRIVATE_KEY: ${{ secrets.SIGNING_GPG_PRIVATE_KEY }}
      SIGNING_GPG_PASSPHRASE: ${{ secrets.SIGNING_GPG_PASSPHRASE }}

  notify_issues:
    needs: [tip_build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          sparse-checkout: .github/scripts

      - name: Notify issues about tip build
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { default: notify } = require('./.github/scripts/tip-build-notify-issues.ts');
            await notify({ github, context, core });

  build_no_proxy:
    # Only run no_proxy builds on main branch to save CI time
    if: github.ref == 'refs/heads/main'
    needs: [lint]
    uses: ./.github/workflows/build-no-proxy.yml
    permissions:
      contents: read
    secrets: inherit

  integration_tests:
    needs: [base_tests, build]
    uses: ./.github/workflows/integration-test.yml
    permissions:
      contents: read
      checks: write
    secrets: inherit

  oidc_integration_tests:
    needs: [base_tests, build]
    uses: ./.github/workflows/oidc-integration-test.yml
    permissions:
      id-token: write
      contents: read
      checks: write
    secrets: inherit

  # Process the test outputs from every job above and fail if any test defined in
  # the code base was never executed by any job (e.g. a build-tagged test whose
  # name does not match its job's -run filter).
  detect_never_run_tests:
    needs: [base_tests, integration_tests, oidc_integration_tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Use mise to install dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.12
          cache_save: ${{ github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          gocache-name: test

      - name: Download test outputs from all jobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: test-outputs

      - name: Detect tests that never ran
        run: ./.github/scripts/ci/check-tests-ran.sh test-outputs ./internal/... ./pkg/...


