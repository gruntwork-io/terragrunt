name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Skips the Go jobs for pushes that touch only docs, and the install script
  # tests for pushes that leave the install script alone. Every Go job needs
  # lint, so gating lint skips the rest.
  changes:
    name: Detect changes
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      install: ${{ steps.detect.outputs.install }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Full history for the merge base with main; file lists need no blobs.
          fetch-depth: 0
          filter: blob:none

      - name: Detect changes
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: ./.github/scripts/ci/detect-changes.sh "$BEFORE" >>"$GITHUB_OUTPUT"

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
    secrets: inherit

  static_checks:
    uses: ./.github/workflows/static-checks.yml
    permissions:
      contents: read
    secrets: inherit

  install_script_test:
    needs: [changes]
    if: needs.changes.outputs.install == 'true'
    uses: ./.github/workflows/install-script-test.yml
    permissions:
      contents: read
    secrets: inherit

  # Only fast checks gate here. Anything added to this needs list delays the
  # whole integration matrix behind it; the rest are enforced by branch
  # protection rules, not by job dependencies.
  base_tests:
    needs: [lint]
    uses: ./.github/workflows/base-test.yml
    permissions:
      contents: read
      checks: write
    secrets: inherit

  sandboxed_tests:
    needs: [lint]
    uses: ./.github/workflows/sandboxed-test.yml
    permissions:
      contents: read
    secrets: inherit

  build:
    needs: [lint]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref == 'refs/heads/main' && format('tip-{0}', github.sha) || '' }}
    permissions:
      contents: read
    secrets: inherit

  tip_build:
    needs: [build]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/upload-tip-build.yml
    with:
      prefix: tip
      commit_sha: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets:
      TIP_BUILD_ROLE_ARN: ${{ secrets.TIP_BUILD_ROLE_ARN }}
      TIP_BUILD_BUCKET: ${{ secrets.TIP_BUILD_BUCKET }}
      SIGNING_GPG_PRIVATE_KEY: ${{ secrets.SIGNING_GPG_PRIVATE_KEY }}
      SIGNING_GPG_PASSPHRASE: ${{ secrets.SIGNING_GPG_PASSPHRASE }}

  notify_issues:
    needs: [tip_build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          sparse-checkout: .github/scripts

      - name: Notify issues about tip build
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { default: notify } = require('./.github/scripts/tip-build-notify-issues.ts');
            await notify({ github, context, core });

  # Nothing needs this job, so it never delays another one. It fails only when
  # the benchmarks cannot run, never because a metric moved. It runs the fast
  # suite; the benchmarks that run a real tofu take about two hours and run
  # nightly, in benchmark-nightly.yml.
  benchmark:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/benchmark.yml
    with:
      comparison: push
      before_sha: ${{ github.event.before }}
      # Wider than the nightly thresholds, to keep runner noise off pull requests.
      time_threshold_pct: ${{ vars.BENCH_PUSH_TIME_THRESHOLD_PCT || '10' }}
      memory_threshold_pct: ${{ vars.BENCH_PUSH_MEMORY_THRESHOLD_PCT || '10' }}
      alloc_threshold_pct: ${{ vars.BENCH_PUSH_ALLOC_THRESHOLD_PCT || '3' }}
      go_count: "5"
      # A branch reports on its pull request instead, in benchmark_comment.
      notify_slack: ${{ github.ref == 'refs/heads/main' && vars.BENCH_NOTIFY_SLACK == 'true' }}
    permissions:
      contents: read
    secrets:
      COVERAGE_SLACK_WEBHOOK_URL: ${{ secrets.COVERAGE_SLACK_WEBHOOK_URL }}

  # Runs apart from the benchmark job so that the job building and running the
  # pushed code has no write access.
  benchmark_comment:
    needs: [benchmark]
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download benchmark report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-push-fast
          path: benchmark-report

      - name: Update the pull request comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const { default: notify } = require('./.github/scripts/benchmark/notify-pr.ts');
            await notify({
              github,
              context,
              core,
              report: JSON.parse(fs.readFileSync('benchmark-report/report.json', 'utf8')),
              summary: fs.readFileSync('benchmark-report/comment.md', 'utf8'),
            });

  build_no_proxy:
    # Only run no_proxy builds on main branch to save CI time
    if: github.ref == 'refs/heads/main'
    needs: [lint]
    uses: ./.github/workflows/build-no-proxy.yml
    permissions:
      contents: read
    secrets: inherit

  integration_tests:
    needs: [base_tests, build]
    uses: ./.github/workflows/integration-test.yml
    permissions:
      contents: read
      checks: write
    secrets: inherit

  oidc_integration_tests:
    needs: [base_tests, build]
    uses: ./.github/workflows/oidc-integration-test.yml
    permissions:
      id-token: write
      contents: read
      checks: write
    secrets: inherit

  # Process the test outputs from every job above and fail if any test defined in
  # the code base was never executed by any job (e.g. a build-tagged test whose
  # name does not match its job's -run filter).
  detect_never_run_tests:
    needs: [base_tests, integration_tests, oidc_integration_tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Use mise to install dependencies
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.0
          cache_save: ${{ github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          gocache-name: test

      - name: Download test outputs from all jobs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: test-outputs

      - name: Detect tests that never ran
        run: ./.github/scripts/ci/check-tests-ran.sh test-outputs ./internal/... ./pkg/...


