name: Docs Cleanup Version Gates

on:
  release:
    # Intentionally `released`, not `published`, so prereleases do not trigger
    # cleanup (mirrors announce-release.yml).
    types: [released]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Latest release tag to clean up against (e.g. v1.0.7)'
        required: true
      max_pr_age_days:
        description: 'Re-target only open PRs updated within this many days'
        required: false
        default: '30'

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove obsolete docs version gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Use mise to install dependencies
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.11.0
          cache_save: ${{ github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove released Before/Since gates
        env:
          LATEST_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: mise x bun -- bun .github/scripts/docs-cleanup-version-gates.ts

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7
        with:
          sign-commits: true
          branch: docs/cleanup-version-gates
          commit-message: 'docs: clean up released version gates for ${{ github.event.release.tag_name || inputs.tag_name }}'
          title: 'docs: clean up released version gates for ${{ github.event.release.tag_name || inputs.tag_name }}'
          labels: automated
          body: |
            Now that `${{ github.event.release.tag_name || inputs.tag_name }}` has shipped, this removes the documentation
            version gates it made obsolete:

            - `<Before version="…">` blocks at or below the latest release are removed
              along with their contents (they can no longer render).
            - `<Since version="…">` blocks at or below the latest release are unwrapped,
              keeping their contents (now permanently displayed).

            Gates for versions above the latest release are left untouched. Generated by
            the `docs-cleanup-version-gates` workflow.

            > [!TIP]
            > Push an empty commit to this PR to trigger CI checks, which do not run
            > automatically on commits made by the `GITHUB_TOKEN`.

  retarget-open-prs:
    name: Re-target open PRs to the next patch release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          sparse-checkout: .github/scripts

      - name: Open chained PRs for stale changelog entries and gates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
          MAX_PR_AGE_DAYS: ${{ inputs.max_pr_age_days || '30' }}
        with:
          script: |
            const { default: retarget } = require('./.github/scripts/docs-retarget-open-prs.ts');
            await retarget({
              github,
              context,
              core,
              tagName: process.env.TAG_NAME,
              maxAgeDays: Number(process.env.MAX_PR_AGE_DAYS),
            });
