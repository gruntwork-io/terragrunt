name: Go Mod Tidy Check

on:
  workflow_call:

jobs:
  go-mod-tidy-check:
    name: Check go.mod and go.sum are tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Use mise to install dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.12
          cache_save: ${{ github.ref == 'refs/heads/main' }}
        env:
          # Adding token here to reduce the likelihood of hitting rate limit issues.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore

      - name: Check go mod tidy
        run: ./.github/scripts/ci/check-go-mod-tidy.sh
