name: Lint

on:
  workflow_call:

jobs:
  # Linux only: every darwin build constraint in the tree is `linux || darwin`,
  # so a macOS run type-checks an identical set of files.
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
    env:
      # Reduce GC frequency (default 100) to speed up builds/tests at cost of higher memory
      GOGC: "400"

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      with:
        fetch-depth: 0

    - name: Set up mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: 2026.5.12
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - id: go-cache-paths
      shell: bash
      run: ./.github/scripts/ci/go-cache-paths.sh

    - name: Go Build Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: ${{ steps.go-cache-paths.outputs.go-build }}
        key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}-${{ matrix.os }}-${{ runner.arch }}
        restore-keys: |
          ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}-${{ matrix.os }}-

    - name: Go Mod Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: ${{ steps.go-cache-paths.outputs.go-mod }}
        key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}-${{ matrix.os }}-${{ runner.arch }}
        restore-keys: |
          ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}-${{ matrix.os }}-
          ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}-
          ${{ runner.os }}-go-mod-

    - name: golangci-lint Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: ${{ steps.go-cache-paths.outputs.golangci-lint-cache }}
        key: ${{ runner.os }}-golangci-lint-${{ hashFiles('**/go.sum') }}-${{ matrix.os }}-${{ runner.arch }}
        restore-keys: |
          ${{ runner.os }}-golangci-lint-${{ hashFiles('**/go.sum') }}-${{ matrix.os }}-
          ${{ runner.os }}-golangci-lint-

    # fetch-depth: 0 fetches current branch history; origin/main ref must be fetched separately.
    # Use refspec main:main to create a local branch (required for git merge-base main HEAD).
    - name: Fetch main branch
      if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
      run: git fetch origin main:main

    - name: Set memory limits
      run: ./.github/scripts/ci/set-go-memory-limits.sh

    - name: Lint
      run: ./.github/scripts/ci/run-lint.sh
      env:
        GITHUB_REF: ${{ github.ref }}
