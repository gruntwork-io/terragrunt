name: Lint

on:
  workflow_call:

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
    env:
      # Reduce GC frequency (default 100) to speed up builds/tests at cost of higher memory
      GOGC: "400"

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      with:
        fetch-depth: 0

    - name: Set up mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: 2026.5.12
        cache_save: ${{ github.ref == 'refs/heads/main' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Restore Go caches
      uses: $/.github/actions/go-cache-restore
      with:
        gocache-name: lint

    - name: golangci-lint Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: ~/.cache/golangci-lint
        key: ${{ runner.os }}-golangci-lint-${{ hashFiles('**/go.sum') }}-${{ matrix.os }}-${{ runner.arch }}
        restore-keys: |
          ${{ runner.os }}-golangci-lint-${{ hashFiles('**/go.sum') }}-${{ matrix.os }}-
          ${{ runner.os }}-golangci-lint-

    # fetch-depth: 0 fetches current branch history; origin/main ref must be fetched separately.
    # Use refspec main:main to create a local branch (required for git merge-base main HEAD).
    - name: Fetch main branch
      if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
      run: git fetch origin main:main

    - name: Set memory limits
      run: ./.github/scripts/ci/set-go-memory-limits.sh

    - name: Lint
      run: ./.github/scripts/ci/run-lint.sh
      env:
        GITHUB_REF: ${{ github.ref }}

    - name: Save Go caches
      if: ${{ !cancelled() }}
      uses: $/.github/actions/go-cache-save
