name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g., v1.0.2 or v1.1.0-rc1 (a draft release is created if none exists)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Validate the version is valid semver, create a draft release for it
  # if none exists, and check the release targets an explicit commit SHA.
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate semver
        env:
          VERSION: ${{ inputs.version }}
        run: .github/scripts/release/validate-semver.sh "$VERSION"

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: .github/scripts/release/check-release-exists.sh

      - name: Use mise to install bun
        if: steps.check_release.outputs.exists == 'false'
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: bun
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install docs dependencies
        if: steps.check_release.outputs.exists == 'false'
        working-directory: docs
        run: mise x bun -- bun install --frozen-lockfile --ignore-scripts

      - name: Build release notes from the docs changelog
        if: steps.check_release.outputs.exists == 'false'
        working-directory: docs
        env:
          VERSION: ${{ inputs.version }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise x bun -- bun run release-notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Create draft release
        if: steps.check_release.outputs.exists == 'false'
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ github.sha }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/release/create-draft-release.sh

      - name: Resolve version and ref
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/release/resolve-version-ref.sh

      - name: Enforce commit SHA target
        env:
          REF: ${{ steps.resolve.outputs.ref }}
        run: .github/scripts/release/enforce-commit-sha.sh "$REF"

  # Build and sign all binaries (reuses build.yml workflow)
  build-and-sign:
    name: Build and Sign All Binaries
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      is_release: true
      ref: ${{ needs.validate.outputs.ref }}
    permissions:
      contents: read
    secrets: inherit

  # Compare the commit being released with the latest published release. No
  # other job needs this one, so it never holds up the upload.
  benchmark:
    name: Benchmark Against Latest Release
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        suite: [fast, integration]
    uses: ./.github/workflows/benchmark.yml
    with:
      comparison: release
      suite: ${{ matrix.suite }}
      ref: ${{ needs.validate.outputs.ref }}
      # One pass of the integration suite takes about ten minutes a side.
      go_count: ${{ matrix.suite == 'integration' && '4' || '6' }}
      time_threshold_pct: ${{ vars.BENCH_TIME_THRESHOLD_PCT || '5' }}
      memory_threshold_pct: ${{ vars.BENCH_MEMORY_THRESHOLD_PCT || '10' }}
      alloc_threshold_pct: ${{ vars.BENCH_ALLOC_THRESHOLD_PCT || '2' }}
      notify_slack: ${{ vars.BENCH_NOTIFY_SLACK == 'true' }}
    permissions:
      contents: read
    secrets:
      COVERAGE_SLACK_WEBHOOK_URL: ${{ secrets.COVERAGE_SLACK_WEBHOOK_URL }}

  # Upload binaries to the draft GitHub release
  upload-assets:
    name: Upload Release Assets
    needs: [validate, build-and-sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.validate.outputs.ref }}

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: .github/scripts/release/check-release-exists.sh

      - name: Download pre-built signed binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: all-signed-binaries
          path: bin/

      - name: Verify binaries downloaded
        run: .github/scripts/release/verify-binaries-downloaded.sh bin 7

      - name: Set execution permissions on binaries
        run: .github/scripts/release/set-permissions.sh bin

      - name: Create ZIP and TAR.GZ archives
        run: .github/scripts/release/create-archives.sh bin

      - name: Generate SHA256SUMS
        run: .github/scripts/release/generate-checksums.sh bin

      - name: Import GPG key and export public key
        env:
          SIGNING_GPG_PRIVATE_KEY: ${{ secrets.SIGNING_GPG_PRIVATE_KEY }}
        run: .github/scripts/release/import-gpg-key.sh bin

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4

      - name: Sign SHA256SUMS
        env:
          SIGNING_GPG_PASSPHRASE: ${{ secrets.SIGNING_GPG_PASSPHRASE }}
        run: .github/scripts/release/sign-checksums.sh bin

      - name: Verify signatures before upload
        run: .github/scripts/release/verify-files.sh bin

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          CLOBBER: 'true'
        run: .github/scripts/release/upload-assets.sh bin

      - name: Verify all assets uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          CLOBBER: 'true'
        run: .github/scripts/release/verify-assets-uploaded.sh bin

      - name: Upload summary
        if: always()
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_ID: ${{ steps.check_release.outputs.release_id }}
          IS_DRAFT: ${{ steps.check_release.outputs.is_draft }}
        run: .github/scripts/release/generate-upload-summary.sh
