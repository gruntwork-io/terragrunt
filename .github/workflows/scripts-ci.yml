name: Scripts CI

on:
  push:
    paths:
      - "**/*.sh"
      - "**/*.bats"
      - ".github/scripts/**/*.ts"
      - ".github/scripts/package.json"
      - ".github/scripts/bun.lock"
      - ".github/scripts/tsconfig.json"
      - ".github/workflows/scripts-ci.yml"
      - "docs/vercel.json"
      - "mise.toml"

jobs:
  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Use mise to install dependencies
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: 2026.5.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: shellcheck
        run: |
          find . -name "*.sh" \
            -not -path "./node_modules/*" \
            -not -path "./docs/node_modules/*" \
            -not -path "./.git/*" \
            -print0 \
            | xargs -0 mise x shellcheck -- shellcheck -x -P SCRIPTDIR

      - name: shfmt
        run: |
          find . -name "*.sh" \
            -not -path "./node_modules/*" \
            -not -path "./docs/node_modules/*" \
            -not -path "./.git/*" \
            -print0 \
            | xargs -0 mise x shfmt -- shfmt -d

  test-shell:
    name: Test shell scripts
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Use mise to install dependencies
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: 2026.5.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: bats
        run: mise x bats -- bats --print-output-on-failure .github/scripts/release/tests/ .github/scripts/coverage/tests/ .github/scripts/security-scan/tests/

  test-js:
    name: Test JS scripts
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Use mise to install dependencies
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: 2026.5.12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: .github/scripts
        run: mise x bun -- bun install --frozen-lockfile

      - name: tsc
        working-directory: .github/scripts
        run: mise x bun -- bunx tsc --noEmit

      - name: bun test
        working-directory: .github/scripts
        run: mise x bun -- bun test
