name: Static Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Use mise to install dependencies
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.0
          cache_save: ${{ github.ref == 'refs/heads/main' }}
        env:
          # Adding token here to reduce the likelihood of hitting rate limit issues.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          gocache-name: test

      # `licensei cache` queries GitHub's API for every dep; cache the result.
      - name: Licensei Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .licensei.cache
          key: ${{ runner.os }}-licensei-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-licensei-

      # Every check runs even after an earlier one fails, so one failure does
      # not hide the checks behind it.
      - name: Run codespell
        if: ${{ !cancelled() }}
        run: codespell

      - name: Run markdownlint
        if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            docs/**/*.md

      - name: Run go fix
        if: ${{ !cancelled() }}
        run: ./.github/scripts/ci/check-go-fix.sh

      - name: Run vend check
        if: ${{ !cancelled() }}
        run: ./.github/scripts/ci/check-vend.sh

      - name: Run tofu fmt
        if: ${{ !cancelled() }}
        run: ./.github/scripts/ci/check-tofu-fmt.sh

      - name: Run shellcheck
        if: ${{ !cancelled() }}
        run: |
          find . -name "*.sh" \
            -not -path "./node_modules/*" \
            -not -path "./docs/node_modules/*" \
            -not -path "./.git/*" \
            -print0 \
            | xargs -0 shellcheck -x -P SCRIPTDIR

      - name: Run shfmt
        if: ${{ !cancelled() }}
        run: |
          find . -name "*.sh" \
            -not -path "./node_modules/*" \
            -not -path "./docs/node_modules/*" \
            -not -path "./.git/*" \
            -print0 \
            | xargs -0 shfmt -d

      - name: Run bats
        if: ${{ !cancelled() }}
        run: |
          bats --print-output-on-failure \
            .github/scripts/benchmark/tests/ \
            .github/scripts/ci/tests/ \
            .github/scripts/release/tests/ \
            .github/scripts/coverage/tests/ \
            .github/scripts/security-scan/tests/ \
            .github/scripts/update-codified-remote-deps/tests/

      - name: Install script dependencies
        id: bun-install
        if: ${{ !cancelled() }}
        working-directory: .github/scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck scripts
        if: ${{ !cancelled() && steps.bun-install.outcome == 'success' }}
        working-directory: .github/scripts
        run: bun run typecheck

      - name: Test scripts
        if: ${{ !cancelled() && steps.bun-install.outcome == 'success' }}
        working-directory: .github/scripts
        run: bun test

      - name: Install docs dependencies
        id: docs-bun-install
        if: ${{ !cancelled() }}
        working-directory: docs
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck docs
        if: ${{ !cancelled() && steps.docs-bun-install.outcome == 'success' }}
        working-directory: docs
        run: bun run typecheck

      - name: Test docs
        if: ${{ !cancelled() && steps.docs-bun-install.outcome == 'success' }}
        working-directory: docs
        run: bun test

      - name: Run License Check
        if: ${{ !cancelled() }}
        run: ./.github/scripts/ci/run-license-check.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload License Check Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-check-report
          path: license-check.log
