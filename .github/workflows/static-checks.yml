name: Static Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Use mise to install dependencies
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.12
          cache_save: ${{ github.ref == 'refs/heads/main' }}
        env:
          # Adding token here to reduce the likelihood of hitting rate limit issues.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Go caches
        uses: $/.github/actions/go-cache-restore
        with:
          gocache-name: test

      # `licensei cache` queries GitHub's API for every dep; cache the result.
      - name: Licensei Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .licensei.cache
          key: ${{ runner.os }}-licensei-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-licensei-

      # Every check runs even after an earlier one fails, so one failure does
      # not hide the checks behind it.
      - name: Run codespell
        if: ${{ !cancelled() }}
        run: codespell

      - name: Run markdownlint
        if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: |
            docs/**/*.md

      - name: Run go fix
        if: ${{ !cancelled() }}
        run: ./.github/scripts/ci/check-go-fix.sh

      - name: Run vend check
        if: ${{ !cancelled() }}
        run: ./.github/scripts/ci/check-vend.sh

      - name: Run tofu fmt
        if: ${{ !cancelled() }}
        run: ./.github/scripts/ci/check-tofu-fmt.sh

      - name: Run shellcheck
        if: ${{ !cancelled() }}
        run: |
          find . -name "*.sh" \
            -not -path "./node_modules/*" \
            -not -path "./docs/node_modules/*" \
            -not -path "./.git/*" \
            -print0 \
            | xargs -0 shellcheck -x -P SCRIPTDIR

      - name: Run shfmt
        if: ${{ !cancelled() }}
        run: |
          find . -name "*.sh" \
            -not -path "./node_modules/*" \
            -not -path "./docs/node_modules/*" \
            -not -path "./.git/*" \
            -print0 \
            | xargs -0 shfmt -d

      - name: Run bats
        if: ${{ !cancelled() }}
        run: bats --print-output-on-failure .github/scripts/ci/tests/ .github/scripts/release/tests/ .github/scripts/coverage/tests/ .github/scripts/security-scan/tests/

      - name: Install script dependencies
        id: bun-install
        if: ${{ !cancelled() }}
        working-directory: .github/scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck scripts
        if: ${{ !cancelled() && steps.bun-install.outcome == 'success' }}
        working-directory: .github/scripts
        run: bun run typecheck

      - name: Test scripts
        if: ${{ !cancelled() && steps.bun-install.outcome == 'success' }}
        working-directory: .github/scripts
        run: bun test

      - name: Run License Check
        if: ${{ !cancelled() }}
        run: ./.github/scripts/ci/run-license-check.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload License Check Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-check-report
          path: license-check.log
