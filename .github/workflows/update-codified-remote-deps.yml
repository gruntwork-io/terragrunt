name: Update Codified Remote Dependencies

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-stacks-example:
    permissions:
      contents: write
      pull-requests: write
    name: Live Stacks Example Commit
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Check for update
        id: check
        run: .github/scripts/update-codified-remote-deps/check-live-stacks-example.sh

      - name: Update commit hash
        if: steps.check.outputs.needs_update == 'true'
        env:
          CURRENT_COMMIT: ${{ steps.check.outputs.current }}
          LATEST_COMMIT: ${{ steps.check.outputs.latest }}
        run: |
          sed -i "s/$CURRENT_COMMIT/$LATEST_COMMIT/" test/integration_example_live_stacks_test.go

      - name: Create pull request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7
        with:
          sign-commits: true
          branch: chore/update-live-stacks-example-commit
          commit-message: 'chore: Update live stacks example commit to ${{ steps.check.outputs.latest }}'
          title: 'chore: Update live stacks example commit'
          body: |
            Updates the pinned commit in `TestExampleLiveStacks` from:
            - `${{ steps.check.outputs.current }}`
            to:
            - `${{ steps.check.outputs.latest }}`

            [Compare changes](https://github.com/gruntwork-io/terragrunt-infrastructure-live-stacks-example/compare/${{ steps.check.outputs.current }}...${{ steps.check.outputs.latest }})
          labels: automated

  opentofu:
    permissions:
      contents: write
      pull-requests: write
    name: OpenTofu Version
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install: false
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for update
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/update-codified-remote-deps/check-opentofu.sh

      - name: Update version
        if: steps.check.outputs.needs_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_VERSION: ${{ steps.check.outputs.latest }}
        run: |
          mise lock "opentofu@$LATEST_VERSION"

      - name: Add compatibility entry
        id: compatibility
        if: steps.check.outputs.needs_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_VERSION: ${{ steps.check.outputs.latest }}
        run: |
          mise x jq -- .github/scripts/update-codified-remote-deps/add-compatibility-entry.sh opentofu "$LATEST_VERSION"

      - name: Create pull request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7
        with:
          sign-commits: true
          branch: chore/update-opentofu-version
          commit-message: 'chore: Bump OpenTofu to `v${{ steps.check.outputs.latest }}`'
          title: 'chore: Bump OpenTofu to `v${{ steps.check.outputs.latest }}`'
          body: |
            Bumps the OpenTofu version in `mise.toml` and `mise.lock` from `v${{ steps.check.outputs.current }}` to `v${{ steps.check.outputs.latest }}`.

            [Release notes](https://github.com/opentofu/opentofu/releases/tag/v${{ steps.check.outputs.latest }})

            ${{ steps.compatibility.outputs.note }}
          labels: automated

  terraform:
    permissions:
      contents: write
      pull-requests: write
    name: Terraform Version
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install: false
          cache: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for update
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/update-codified-remote-deps/check-terraform.sh

      - name: Update version
        if: steps.check.outputs.needs_update == 'true'
        env:
          CURRENT_VERSION: ${{ steps.check.outputs.current }}
          LATEST_VERSION: ${{ steps.check.outputs.latest }}
        run: |
          sed -i "s/${CURRENT_VERSION//./\\.}/$LATEST_VERSION/g" .github/scripts/setup/terraform-switch-latest.sh

      - name: Add compatibility entry
        id: compatibility
        if: steps.check.outputs.needs_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_VERSION: ${{ steps.check.outputs.latest }}
        run: |
          mise x jq -- .github/scripts/update-codified-remote-deps/add-compatibility-entry.sh terraform "$LATEST_VERSION"

      - name: Create pull request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7
        with:
          sign-commits: true
          branch: chore/update-terraform-version
          commit-message: 'chore: Bump Terraform to `v${{ steps.check.outputs.latest }}`'
          title: 'chore: Bump Terraform to `v${{ steps.check.outputs.latest }}`'
          body: |
            Bumps the Terraform version used by `.github/scripts/setup/terraform-switch-latest.sh` from `v${{ steps.check.outputs.current }}` to `v${{ steps.check.outputs.latest }}`.

            [Release notes](https://github.com/hashicorp/terraform/releases/tag/v${{ steps.check.outputs.latest }})

            ${{ steps.compatibility.outputs.note }}
          labels: automated
