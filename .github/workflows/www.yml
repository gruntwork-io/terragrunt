name: www

on:
  pull_request:
    paths:
      - "www/**"
      - ".github/workflows/www.yml"
  push:
    branches: [main]
    paths:
      - "www/**"
      - ".github/workflows/www.yml"

permissions:
  contents: read

jobs:
  gates:
    name: Build and gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `gates` runs vercel:check, then a build, then the two checks that read
      # the build. Each refuses to pass without a build rather than treating an
      # empty dist as "nothing wrong".
      - name: Run gates
        run: bun run gates

      - name: Type-check
        run: bun run check
